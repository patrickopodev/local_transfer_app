name: Build Signed Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/app/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed release AAB
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Build signed release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify AAB signing certificate
        run: |
          set -euo pipefail
          EXPECTED_SHA1="2D:5D:32:8C:36:4E:B7:30:99:07:35:92:4C:58:95:BC:88:1F:06:F2"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          rm -rf /tmp/aabsig && mkdir -p /tmp/aabsig
          unzip -q -o "$AAB" 'META-INF/*' -d /tmp/aabsig
          SIG="$(find /tmp/aabsig/META-INF -type f \( -name '*.RSA' -o -name '*.DSA' -o -name '*.EC' \) | head -n1)"
          if [ -z "$SIG" ]; then
            echo "::error::No signature block found in $AAB - the bundle is UNSIGNED and Play will reject it."
            exit 1
          fi
          ACTUAL_SHA1="$(keytool -printcert -file "$SIG" \
            | grep -iE 'sha-?1' \
            | head -n1 \
            | grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){19}' \
            | tr 'a-f' 'A-F' || true)"
          echo "Signing certificate SHA1: ${ACTUAL_SHA1:-<unparseable>}"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signed with the wrong key. Play expects $EXPECTED_SHA1"
            exit 1
          fi
          echo "Signing key matches the Play upload certificate."

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: localdrop-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: localdrop-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
