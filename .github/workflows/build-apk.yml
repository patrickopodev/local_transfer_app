name: Build AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug AAB
        run: flutter build appbundle --debug --android-skip-build-dependency-validation

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: localdrop-debug-aab
          path: build/app/outputs/bundle/debug/app-debug.aab